                  value: 1288.00,
                  currency: 'USD'
                });
              }

              // 涟漪效果
              const ripple = document.createElement('div');
              ripple.style.position = 'absolute';
              ripple.style.background = 'rgba(255, 255, 255, 0.6)';
              ripple.style.borderRadius = '50%';
              ripple.style.transform = 'scale(0)';
              ripple.style.animation = 'ripple 0.6s linear';
              ripple.style.left = (e.offsetX - 10) + 'px';
              ripple.style.top = (e.offsetY - 10) + 'px';
              ripple.style.width = '20px';
              ripple.style.height = '20px';

              this.appendChild(ripple);

              setTimeout(() => {
                ripple.remove();
              }, 600);
            });
          }
        });
      }

      // 半屏廣告檢測
      function detectHalfScreenAd() {
        // 檢測視窗高度，如果太小可能是半屏廣告
        if (window.innerHeight < 500) {
          document.body.classList.add('half-screen-mode');

          // 可以添加額外的半屏優化邏輯
          console.log('檢測到可能的半屏廣告環境');

          // 確保頂部註冊條更加突出
          const topBar = document.querySelector('.top-register-bar');
          if (topBar) {
            topBar.style.background = 'linear-gradient(90deg, #ff6b00, #ff8c42)';
            topBar.style.animation = 'pulse 2s infinite';
          }
        }
      }

      // 添加脈衝動畫
      const style = document.createElement('style');
      style.textContent = `
        @keyframes pulse {
          0% { transform: scale(1); }
          50% { transform: scale(1.02); }
          100% { transform: scale(1); }
        }
        @keyframes ripple {
          to {
            transform: scale(4);
            opacity: 0;
          }
        }
      `;
      document.head.appendChild(style);

      document.addEventListener('DOMContentLoaded', function() {
        createParticles();
        updateLinkByLocation();
        setupFacebookTracking(); // 添加Facebook事件追踪
        detectHalfScreenAd(); // 新增半屏檢測

        const observerOptions = {
          threshold: 0.1,
          rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver(function(entries) {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('active');
            }
          });
        }, observerOptions);

        document.querySelectorAll('.reveal').forEach(el => {
          observer.observe(el);
        });
      });

      // 視窗大小改變時重新檢測
      window.addEventListener('resize', detectHalfScreenAd);
    </script>
  </body>
</html>
